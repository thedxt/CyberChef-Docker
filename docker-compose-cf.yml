services:
    cyberchef_app:
        container_name: ${CONTAINER_NAME}_app
        image: ghcr.io/gchq/cyberchef:latest
        restart: unless-stopped
        ports:
            - ${APP_PORT}:8080
        depends_on:
          - cyberchef_cf_tunnel

    cyberchef_cf_tunnel:
        container_name: ${CONTAINER_NAME}_cf
        image: cloudflare/cloudflared
        restart: unless-stopped
        command: tunnel run
        user: root
        environment:
          - TUNNEL_TOKEN=${CF_TUNNEL}
